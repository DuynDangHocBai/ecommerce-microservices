services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    init: true
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
    ports:
      - "${AUTH_DB_PORT:-15433}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user} -d ${AUTH_DB_NAME:-auth_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  customer-db:
    image: postgres:16-alpine
    container_name: customer-db
    init: true
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME:-customer_db}
      POSTGRES_USER: ${CUSTOMER_DB_USER:-customer_user}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer_password}
    ports:
      - "${CUSTOMER_DB_PORT:-15434}:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CUSTOMER_DB_USER:-customer_user} -d ${CUSTOMER_DB_NAME:-customer_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    init: true
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order_db}
      POSTGRES_USER: ${ORDER_DB_USER:-order_user}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_password}
    ports:
      - "${ORDER_DB_PORT:-15435}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ORDER_DB_USER:-order_user} -d ${ORDER_DB_NAME:-order_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  product-db:
    image: mongo:7
    container_name: product-db
    ports:
      - "${PRODUCT_DB_PORT:-37018}:27017"
    volumes:
      - product-db-data:/data/db
    init: true
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/27017' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-net

  shipment-db:
    image: mongo:7
    container_name: shipment-db
    ports:
      - "${SHIPMENT_DB_PORT:-37019}:27017"
    volumes:
      - shipment-db-data:/data/db
    init: true
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/27017' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecommerce-net

  redis:
    image: redis:7-alpine
    container_name: redis
    init: true
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    init: true
    stop_grace_period: 30s
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 40s
    networks:
      - ecommerce-net

  kafka-init:
    image: apache/kafka:3.7.2
    container_name: kafka-init
    init: true
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order-created --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    networks:
      - ecommerce-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    init: true
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 4101
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_password}@auth-db:5432/${AUTH_DB_NAME:-auth_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 3600
      CUSTOMER_GRPC_URL: customer-service:50052
      PROTO_DIR: /app/proto
      NODE_ENV: production
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4101/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      auth-db:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    networks:
      - ecommerce-net

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    container_name: customer-service
    init: true
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 4102
      GRPC_PORT: 50052
      DATABASE_URL: postgresql://${CUSTOMER_DB_USER:-customer_user}:${CUSTOMER_DB_PASSWORD:-customer_password}@customer-db:5432/${CUSTOMER_DB_NAME:-customer_db}?schema=public
      PROTO_DIR: /app/proto
      NODE_ENV: production
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4102/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      customer-db:
        condition: service_healthy
    networks:
      - ecommerce-net

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    init: true
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 4103
      GRPC_PORT: 50053
      MONGO_URI: mongodb://product-db:27017/${PRODUCT_DB_NAME:-product_db}
      PROTO_DIR: /app/proto
      NODE_ENV: production
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4103/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - ecommerce-net

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    init: true
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 4104
      DATABASE_URL: postgresql://${ORDER_DB_USER:-order_user}:${ORDER_DB_PASSWORD:-order_password}@order-db:5432/${ORDER_DB_NAME:-order_db}?schema=public
      CUSTOMER_GRPC_URL: customer-service:50052
      PRODUCT_GRPC_URL: product-service:50053
      PROTO_DIR: /app/proto
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: order-service
      KAFKA_TOPIC_ORDER_CREATED: order-created
      OUTBOX_POLL_INTERVAL_MS: 2000
      OUTBOX_BATCH_SIZE: 50
      NODE_ENV: production
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4104/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      order-db:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecommerce-net

  shipment-service:
    build:
      context: .
      dockerfile: shipment-service/Dockerfile
    container_name: shipment-service
    init: true
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 4105
      MONGO_URI: mongodb://shipment-db:27017/${SHIPMENT_DB_NAME:-shipment_db}
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: shipment-service
      KAFKA_TOPIC_ORDER_CREATED: order-created
      NODE_ENV: production
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4105/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      shipment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecommerce-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    init: true
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "18080:4100"
    environment:
      PORT: 4100
      AUTH_SERVICE_URL: http://auth-service:4101
      CUSTOMER_SERVICE_URL: http://customer-service:4102
      PRODUCT_SERVICE_URL: http://product-service:4103
      ORDER_SERVICE_URL: http://order-service:4104
      SHIPMENT_SERVICE_URL: http://shipment-service:4105
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_MAX: 10
      PRODUCT_CACHE_TTL: 60
      HEALTH_SERVICES: auth,customer,product,order,shipment
      NODE_ENV: production
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4100/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
    networks:
      - ecommerce-net


volumes:
  auth-db-data:
  customer-db-data:
  order-db-data:
  product-db-data:
  shipment-db-data:

networks:
  ecommerce-net:
    driver: bridge
